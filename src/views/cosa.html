<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Factura directa a Dropbox</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Generar PDF y subir a Dropbox sin guardar</h2>
  <button id="btn">Generar y subir factura</button>
  <p id="resultado"></p>

  <script>
    document.getElementById('btn').onclick = async () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Factura sin guardar archivo físico", 10, 10);
      
      const pdfBlob = doc.output('blob');

      const formData = new FormData();
      formData.append('pdf', pdfBlob, 'factura.pdf');

      document.getElementById('resultado').textContent = "Subiendo a Dropbox...";

      try {
        const res = await fetch('../controllers/OrderController.php', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (data.url) {
          document.getElementById('resultado').innerHTML = 
            `✅ Factura subida. <a href="${data.url}" target="_blank">Ver factura</a>`;
        } else {
          document.getElementById('resultado').textContent = "Error: " + (data.error || 'desconocido');
        }
      } catch (e) {
        document.getElementById('resultado').textContent = "Error: " + e.message;
      }
    };
  </script>
</body>
</html>
